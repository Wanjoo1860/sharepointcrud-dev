<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SharePoint List CRUD (무료)</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>SharePoint List CRUD <span class="env-badge" id="envBadge"></span></h1>

<!-- 로그인 영역 -->
<div class="login-area">
    <button class="btn btn-primary" id="btnLogin" onclick="login()">로그인</button>
    <button class="btn btn-secondary" id="btnLogout" onclick="logout()" style="display:none;">로그아웃</button>
    <span id="loginStatus" style="margin-left:15px; color:#666;">로그인이 필요합니다.</span>
</div>

<!-- 도구 -->
<div class="toolbar">
    <button class="btn btn-primary" onclick="getItems()" id="btnRefresh" disabled>데이터 새로고침</button>
    <span id="countInfo" style="color:#666;"></span>
</div>

<!-- 입력 폼 -->
<div class="form-area">
    <h3 id="formTitle">데이터 추가</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
        <input type="text" id="inputName" placeholder="이름">
        <input type="text" id="inputDept" placeholder="부서">
        <input type="text" id="inputPosition" placeholder="직급">
        <button class="btn btn-success" onclick="saveItem()" id="btnSave" disabled>저장</button>
        <button class="btn btn-secondary" onclick="cancelEdit()">취소</button>
    </div>
</div>

<div class="status" id="status"></div>

<!-- 데이터 테이블 -->
<table>
    <thead>
        <tr>
            <th style="width:60px;">ID</th>
            <th>이름</th>
            <th>부서</th>
            <th>직급</th>
            <th style="width:150px;">작업</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">로그인 후 데이터를 불러옵니다.</td></tr>
    </tbody>
</table>

<!-- Teams JS SDK -->
<script src="https://res.cdn.office.net/teams-js/2.31.1/js/MicrosoftTeams.min.js"></script>
<!-- MSAL.js v4 -->
<script src="https://unpkg.com/@azure/msal-browser@4.25.0/lib/msal-browser.min.js"></script>
<!-- 앱 스크립트 -->
<script src="js/app.js"></script>

</body>
</html>
